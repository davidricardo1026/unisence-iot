# cn-service-engine —— **host** 覆盖层（application-configuration.md §7）。
#
# 基础 application.yml 只保留与环境无关的结构与阈值；端点与凭据全部在这里。
# 加载顺序：application.yml → 本文件 → 环境变量 → 系统属性（后者覆盖前者）。
#
# 本文件用于 Debian VM 访问宿主机中间件，启动时使用 APP_PROFILE=host。
app:
    engine:
        ingress:
            bootstrap-servers: 192.168.122.1:19092
        timeseries:
            endpoints:
                - 192.168.122.1:4001
            jdbc-url: jdbc:mysql://192.168.122.1:4002/unisence_iot?useSSL=false&serverTimezone=UTC&connectionTimeZone=UTC
            user: ""
            password: ""
        mysql:
            host: 192.168.122.1
            port: 8045
            user: root
            password: ss
        redis:
            connection-string: redis://:ss@192.168.122.1:6380/6
