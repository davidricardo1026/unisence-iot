# cn-service-engine —— **dev** 覆盖层（application-configuration.md §7）。
#
# 基础 application.yml 只保留与环境无关的结构与阈值；端点与凭据全部在这里。
# 加载顺序：application.yml → 本文件 → 环境变量 → 系统属性（后者覆盖前者）。
#
# 本文件里的地址全部是 **loopback**，适用于中间件与 engine 同机的场景。
# 在 Debian 开发虚拟机里跑请用 APP_PROFILE=host —— 中间件在宿主机上，loopback 连不通。
app:
    engine:
        ingress:
            bootstrap-servers: 127.0.0.1:19092
        timeseries:
            endpoints:
                - 127.0.0.1:4001
            jdbc-url: jdbc:mysql://127.0.0.1:4002/unisence_iot?useSSL=false&serverTimezone=UTC&connectionTimeZone=UTC
            user: ""
            password: ""
        mysql:
            host: 127.0.0.1
            port: 8045
            user: root
            password: ss
        redis:
            connection-string: redis://:ss@127.0.0.1:6380/6
