# cn-service-admin —— **dev**（application-configuration.md §7）。
# 由 spring.profiles.active 激活，值来自 APP_PROFILE（两类服务共用同一环境变量）。
logging:
    # Spring Boot 的 Log4J2LoggingSystem 只认 logging.config；
    # 传 log4j2.configurationFile 会被它静默覆盖（logging-runtime.md §3.1）
    config: classpath:log4j2-dev.xml
spring:
    datasource:
        url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:8045}/${MYSQL_DATABASE:unisence_iot}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useAffectedRows=true
        username: ${MYSQL_USERNAME:root}
        password: ${MYSQL_PASSWORD:ss}
    data:
        redis:
            host: ${REDIS_HOST:127.0.0.1}
            port: ${REDIS_PORT:6380}
            password: ${REDIS_PASSWORD:ss}
app:
    admin:
        timeseries:
            endpoints:
                - ${GREPTIME_GRPC_ENDPOINT:127.0.0.1:4001}
            jdbc-url: ${GREPTIME_JDBC_URL:jdbc:mysql://127.0.0.1:4002/unisence_iot?useSSL=false&serverTimezone=UTC&connectionTimeZone=UTC}
            user: ${GREPTIME_USER:}
            password: ${GREPTIME_PASSWORD:}
        rule-output:
            kafka:
                bootstrap-servers: ${APP_ADMIN_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}
