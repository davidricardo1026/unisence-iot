plugins {
    id 'java'
}

// 统一版本管理：子模块通过 rootProject.ext.versions.xxx 引用，禁止在子模块硬编码版本号
// Spring 插件版本真理源：gradle.properties（与 settings.gradle pluginManagement 同步）
ext {
    versions = [
        lombok                    : '1.18.42',
        vertx  : '5.1.5',
        greptime: '0.14.6',
        // greptimedb-proto 0.9.0 由 protobuf 3.21 生成，调用 makeExtensionsImmutable()；
        // mysql-connector-j 9.x 会把 protobuf-java 升到 4.x 并在 gRPC 响应解码时 NoSuchMethodError。
        // 本仓只用 Connector/J 的经典协议，不依赖 X DevAPI，故钉死 3.25.x。
        protobuf: '3.25.5',
        mysql                     : '9.6.0',
        log4j                     : '2.25.4',
        // Log4j2 全局异步无锁（AsyncLoggerContextSelector）的支撑库。
        // 不引它时 contextSelector 会静默退回同步模式（logging-runtime.md §2）
        disruptor: '4.0.0',
        junit                     : '5.14.4',
        hikari                    : '7.0.2',
        groovy                    : '5.0.6',
        msgpack: '0.9.12',
        // engine 非 Spring，直接用原生 Kafka client 跑「虚拟线程 + 同步阻塞」消费循环
        kafka  : '4.3.1',
        mybatisPlus: '3.5.15',
        saToken    : '1.45.0',
        redisson: '4.3.1',
        easytrans: '2.0.0',
        caffeine : '3.2.4',
        mapstruct: '1.6.3',
        asm                       : '9.10.1',
        cfr                       : '0.152',
        vineflower                : '1.12.0',
        springBoot                : springBootVersion,
        springCloud               : springCloudVersion,
        springCloudAlibaba        : springCloudAlibabaVersion,
        springDependencyManagement: springDependencyManagementVersion
    ]
}

allprojects {
    group = 'com.unisence.iot'
    version = '1.0.0'

    apply plugin: 'java'
    apply plugin: 'idea'
    apply from: rootProject.file('gradle/encoding-conventions.gradle')

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    idea {
        module {
            downloadSources = false
            downloadJavadoc = false
        }
    }
}

subprojects {
    configurations.configureEach {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
        exclude group: 'org.lz4', module: 'lz4-java'

        resolutionStrategy {
            force "org.projectlombok:lombok:${rootProject.ext.versions.lombok}"
            force "io.vertx:vertx-core:${rootProject.ext.versions.vertx}"
            force "io.greptime:ingester-all:${rootProject.ext.versions.greptime}"
            force "com.google.protobuf:protobuf-java:${rootProject.ext.versions.protobuf}"
            force "com.mysql:mysql-connector-j:${rootProject.ext.versions.mysql}"
            force "org.apache.logging.log4j:log4j-api:${rootProject.ext.versions.log4j}"
            force "org.apache.logging.log4j:log4j-core:${rootProject.ext.versions.log4j}"
            force "org.apache.logging.log4j:log4j-slf4j2-impl:${rootProject.ext.versions.log4j}"
            force "com.zaxxer:HikariCP:${rootProject.ext.versions.hikari}"
            force "org.apache.groovy:groovy:${rootProject.ext.versions.groovy}"
            force "com.baomidou:mybatis-plus-spring-boot3-starter:${rootProject.ext.versions.mybatisPlus}"
            force "com.baomidou:mybatis-plus-jsqlparser:${rootProject.ext.versions.mybatisPlus}"
            force "cn.dev33:sa-token-spring-boot3-starter:${rootProject.ext.versions.saToken}"
            force "org.redisson:redisson-spring-boot-starter:${rootProject.ext.versions.redisson}"
            force "io.github.davidricardo1026:easytrans-spring-boot-starter:${rootProject.ext.versions.easytrans}"
            force "io.github.davidricardo1026:easytrans-processor:${rootProject.ext.versions.easytrans}"
            force "com.github.ben-manes.caffeine:caffeine:${rootProject.ext.versions.caffeine}"
            force "at.yawk.lz4:lz4-java:1.11.0"
        }
    }

    dependencies {
        compileOnly "org.projectlombok:lombok:${rootProject.ext.versions.lombok}"
        annotationProcessor "org.projectlombok:lombok:${rootProject.ext.versions.lombok}"

        implementation "org.apache.logging.log4j:log4j-api:${rootProject.ext.versions.log4j}"
        implementation "org.apache.logging.log4j:log4j-core:${rootProject.ext.versions.log4j}"
        implementation "org.apache.logging.log4j:log4j-slf4j2-impl:${rootProject.ext.versions.log4j}"
        // 全局异步无锁日志：AsyncLoggerContextSelector 依赖 LMAX Disruptor。
        // 放在 subprojects 而非逐模块声明——每个可执行服务都要，库模块带着也无害
        implementation "com.lmax:disruptor:${rootProject.ext.versions.disruptor}"

        testImplementation platform("org.junit:junit-bom:${rootProject.ext.versions.junit}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        // Gradle 9 起不再自动注入 Launcher，必须显式声明，否则 Test Executor 无法启动
        testRuntimeOnly platform("org.junit:junit-bom:${rootProject.ext.versions.junit}")
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

def communityRuntimeIncluded = findProject(':cn-rule-runtime-community') != null
def professionalRuntimeIncluded = findProject(':cn-rule-window-runtime') != null
if (communityRuntimeIncluded) {
    def protectedRuntimeEdition = professionalRuntimeIncluded ? 'professional' : 'community'
    def protectedRuntimeDirectory = layout.projectDirectory.dir('libs')
    def protectedRuntimeJarNames = professionalRuntimeIncluded
        ? [
        "cn-rule-runtime-community-${version}.jar",
        "cn-rule-window-runtime-${version}.jar"
    ]
        : ["cn-rule-runtime-community-${version}.jar"]
    def protectedRuntimeInstallTask = professionalRuntimeIncluded
        ? ':cn-rule-window-runtime:installProtectedProfessionalRuntime'
        : ':cn-rule-runtime-community:installProtectedCommunityRuntime'

    def installTaskType = Class.forName('com.unisence.gradle.ReportProtectedRuntimeInstallation')
    tasks.register('installProtectedRuleRuntime', installTaskType) {
        group = 'protected'
        description = '构建、校验并安装当前 edition 的受保护规则运行时到 libs'

        dependsOn protectedRuntimeInstallTask
        edition = protectedRuntimeEdition
        installedJars.from(protectedRuntimeJarNames.collect { protectedRuntimeDirectory.file(it) })
    }
}
