# 全局异步无锁日志（architecture-features/logging-runtime.md §2）。
#
# 放 classpath 而不是命令行 -D：contextSelector 必须在 Log4j2 初始化的第一刻生效，
# 放命令行意味着任何一处启动脚本漏传就**静默退回同步模式且无任何报错**。
# 放进产物则跟着 jar 走，不可能漏。
log4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector
# 异步队列容量（2 的幂）。256K × 约 200B ≈ 50MB 上限，仅在突发时才真正占满。
log4j2.asyncLoggerRingBufferSize=262144
# 后台线程等待策略。Timeout 在低负载时让出 CPU、高负载时接近自旋，
# 比默认 Block 少一次 park/unpark，也不像 BusySpin 那样常驻烧一个核。
log4j2.asyncLoggerWaitStrategy=Timeout
