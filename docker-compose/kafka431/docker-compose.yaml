services:
  kafka431:
    image: apache/kafka:4.3.1
    container_name: kafka431
    hostname: kafka431
    volumes:
      - /home/ss/docker/data/kafka431/data:/var/lib/kafka/data
    ports:
      # 将宿主机的 19092 映射到容器内部的 9092 (EXTERNAL 端口)
      - "19092:9092"
    environment:
      # === KRaft 模式核心配置 ===
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094

      # === 数据落盘目录（本次新增，缺它上面那个 volume 完全不起作用）===
      # apache/kafka 官方镜像的默认 log 目录是 /tmp/kafka-logs，
      # **不是** /var/lib/kafka/data —— 后者是 confluentinc/cp-kafka 的约定。
      # 不显式设置本项，日志段就全写进容器可写层（/var/lib/docker/overlay2），
      # 也就是宿主机的**根分区**；2026-08-09 一次压测据此写入 145GB 把根分区打满，
      # 并因写满导致 timeindex 损坏、log-retention 线程抛异常整个停摆。
      # 校验方法：容器启动日志里 `log.dirs = /var/lib/kafka/data`（原先是 `log.dirs = null`）。
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # === 监听器与安全协议配置 ===
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094

      # === 核心修改：将 EXTERNAL 通告给外网客户端的地址改为实际 IP ===
      # EXTERNAL: 供外网/局域网及宿主机通过 192.168.122.1:19092 访问
      # INTERNAL: 供 Docker 网络内部的 kafka-ui 通过 kafka431:9093 访问
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://192.168.122.1:19092,INTERNAL://kafka431:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # === 集群与性能配置 ===
      KAFKA_CLUSTER_ID: "MkU3OEVBNTJFV1k2Z01NUE00"
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - kafka-net

  kafka-ui:
    image: kafbat/kafka-ui:b460095
    container_name: kafka-ui
    ports:
      - "28080:8080"
    depends_on:
      - kafka431
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      # 容器内部访问依然使用 INTERNAL 监听器（服务名 + 容器内端口 9093）
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka431:9093
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: admin
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge
